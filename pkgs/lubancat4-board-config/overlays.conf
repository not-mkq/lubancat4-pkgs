# Device tree overlays applied to the kernel device tree at every boot.
#
# One overlay name per line, no ".dtbo" suffix; the files themselves live in
# /boot/overlays/ (shipped by linux-lubancat4-git), and U-Boot applies them before the
# kernel starts, following the fdtoverlays line in /boot/extlinux/extlinux.conf.
#
# Use the command, it keeps this file and extlinux.conf in step:
#     lubancat4-overlay list
#     lubancat4-overlay enable hdmi0-sound
#     lubancat4-overlay clear
#
# Empty means no overlays, which is the equivalent of the vendor
# enable_uboot_overlays=0 default.
