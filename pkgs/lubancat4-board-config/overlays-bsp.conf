# Device tree overlays applied to the BSP kernel device tree at every boot.
#
# One overlay name per line, no ".dtbo" suffix; the files themselves live in
# /boot/bsp/overlays/ (shipped by linux-lubancat4-bsp), and U-Boot applies them before the
# kernel starts, following the fdtoverlays line inside the "bsp" entry of
# /boot/extlinux/extlinux.conf.
#
# These are NOT interchangeable with /etc/lubancat4/overlays: those are built against the
# mainline base tree, these against EmbedFire's vendor tree. Applying one to the other base
# device tree either fails to apply or patches the wrong nodes.
#
# Use the command with -k bsp, it keeps this file and the bsp entry in step:
#     lubancat4-overlay -k bsp list
#     lubancat4-overlay -k bsp enable rk3588s-lubancat-4-dsi1-vp3-1024x600-7inch-ebf410173-overlay
#     lubancat4-overlay -k bsp clear
#
# The DSI line below is enabled by default: without it the BSP device tree leaves the DSI1
# panel path disabled and the board boots with no display. It matches the panel this port was
# brought up on (EBF410173, 7 inch 1024x600 on DSI1, board revision V1). On another revision
# or DSI host, switch to the matching overlay instead.

# 7" 1024x600, EBF410173, DSI1, VP3, board revision V1
rk3588s-lubancat-4-v1-dsi1-vp3-1024x600-7inch-ebf410173-overlay
