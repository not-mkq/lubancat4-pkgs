# sshd drop-in written by scripts/03-mkimg.sh into the image.
#
# openssh ships "PermitRootLogin prohibit-password": root may log in with a key, never with a
# password. The image sets a root password so the console and ssh both behave normally, and
# this drop-in is what lets that password actually be used over the network.
#
# This is a development image on a local network. Change the root password with `passwd` after
# the first boot.
PermitRootLogin yes
PasswordAuthentication yes
